    <script>
      // Resolve the theme before first paint so there is no flash of the wrong colors.
      (function () {
        var mode = 'dark';
        try {
          var saved = localStorage.getItem('theme');
          if (saved === 'light' || saved === 'dark') {
            mode = saved;
          } else if (window.matchMedia('(prefers-color-scheme: light)').matches) {
            mode = 'light';
          }
        } catch (e) {
          /* localStorage unavailable; keep the dark fallback */
        }
        var root = document.documentElement;
        root.setAttribute('data-theme', mode);
        root.style.backgroundColor = mode === 'light' ? '#f7f8fc' : '#1a1a2e';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
